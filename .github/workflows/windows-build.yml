name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ZoomPan
        shell: pwsh
        run: .\scripts\windows\build.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vlc-zoompan-windows-x64
          path: |
            dist/VLCZoomPanSetup.exe
            dist/libzoompan_plugin.dll
            dist/SHA256SUMS.txt

      - name: Resolve release tag
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v'))
        id: release_tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF.Substring(10)
          } else {
            $tag = (Get-Content VERSION -Raw).Trim()
            if (-not $tag.StartsWith("v")) {
              $tag = "v$tag"
            }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "notes=docs/releases/$tag.md" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ZoomPan ${{ steps.release_tag.outputs.tag }}
          body_path: ${{ steps.release_tag.outputs.notes }}
          fail_on_unmatched_files: true
          files: |
            dist/VLCZoomPanSetup.exe
            dist/libzoompan_plugin.dll
            dist/SHA256SUMS.txt
