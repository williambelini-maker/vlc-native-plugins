name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ZoomPan
        shell: pwsh
        run: .\\scripts\\windows\\build.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vlc-zoompan-windows-x64
          path: |
            dist/VLCZoomPanSetup.exe
            dist/libzoompan_plugin.dll
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VLCZoomPanSetup.exe
            dist/libzoompan_plugin.dll
            dist/SHA256SUMS.txt
